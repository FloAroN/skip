<style>
*{scrollbar-width:none;-ms-overflow-style:none}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  /* Pure Warm Obsidian — Zero Blue/Purple Cast */
  --canvas:#111110;
  --bg-grad:linear-gradient(180deg,#161513 0%,#111110 46%,#0c0c0b 100%);
  --ambient:radial-gradient(ellipse 80% 56% at 50% 0%,rgba(212,176,126,.16) 0%,rgba(186,148,100,.05) 48%,transparent 74%);
  --card:linear-gradient(180deg,rgba(30,29,27,.88) 0%,rgba(23,22,20,.90) 100%);
  --card-border:rgba(255,248,236,.105);
  --card-inset:inset 0 1px 0 rgba(255,250,242,.14);
  --card-shadow:0 20px 44px -12px rgba(0,0,0,.52),0 2px 10px rgba(0,0,0,.28);
  --divider:rgba(255,248,236,.085);

  --ink:#faf7f2;
  --ink-soft:rgba(250,247,242,.72);
  --sub:rgba(242,238,231,.66);
  --subtle:rgba(242,238,231,.48);

  --accent:#dfc69f;
  --accent-bg:rgba(223,198,159,.12);
  --accent-border:rgba(223,198,159,.24);

  --sage:#9ed8b3;
  --sage-bg:rgba(158,216,179,.11);
  --sage-border:rgba(158,216,179,.24);

  --scrim-bottom:linear-gradient(to bottom,rgba(14,13,12,0) 0%,rgba(14,13,12,.24) 24%,rgba(14,13,12,.68) 48%,rgba(14,13,12,.90) 72%,rgba(14,13,12,.98) 100%);
  --capsule-bg:linear-gradient(180deg,rgba(31,29,27,.74) 0%,rgba(21,20,18,.80) 100%);
  --capsule-border:rgba(255,248,236,.14);
  --capsule-inset:inset 0 1px 0 rgba(255,250,242,.18);
  --icon-well-bg:rgba(223,198,159,.10);
  --icon-well-border:rgba(223,198,159,.18);

  --cta-primary-bg:linear-gradient(180deg,#fbf8f3 0%,#eae3d7 100%);
  --cta-primary-ink:#121110;
  --cta-primary-shadow:0 10px 24px -4px rgba(0,0,0,.44),inset 0 1px 0 #ffffff;

  --cta-secondary-bg:rgba(255,250,242,.09);
  --cta-secondary-border:rgba(255,248,236,.15);
  --cta-secondary-ink:#faf7f2;

  --nav-bg:rgba(24,23,21,.80);
  --nav-active-bg:linear-gradient(180deg,#fbf8f3 0%,#eae3d7 100%);
  --nav-active-ink:#121110;
  --nav-active-shadow:0 4px 12px rgba(0,0,0,.34),inset 0 1px 0 #ffffff;

  --chip-bg:rgba(255,250,242,.055);
  --chip-border:rgba(255,248,236,.105);
  --chip-active-bg:linear-gradient(180deg,#fbf8f3 0%,#eae3d7 100%);
  --chip-active-ink:#121110;

  --avatar-ring-bg:#161513;
  --avatar-ring-shadow:0 10px 24px rgba(0,0,0,.42),0 0 0 .75px rgba(255,248,236,.16);
  --sheet-bg:rgba(24,23,21,.94);
  --scrim-modal:rgba(8,8,7,.62);
  --check-bg:rgba(255,250,242,.07);
  --check-border:rgba(255,248,236,.28);
  --ring:rgba(223,198,159,.65);
  color-scheme:dark;
}
html.light{
  /* Elevated Warm Alabaster & Silk Ceramic */
  --canvas:#f4f1eb;
  --bg-grad:linear-gradient(180deg,#faf8f4 0%,#f4f1eb 50%,#ece7de 100%);
  --ambient:radial-gradient(ellipse 80% 58% at 50% 0%,rgba(198,162,114,.16) 0%,rgba(198,162,114,.05) 48%,transparent 74%);
  --card:linear-gradient(180deg,rgba(255,255,255,.94) 0%,rgba(253,251,248,.86) 100%);
  --card-border:rgba(22,19,16,.075);
  --card-inset:inset 0 1px 0 #ffffff;
  --card-shadow:0 16px 36px -8px rgba(28,22,16,.08),0 2px 6px rgba(28,22,16,.035);
  --divider:rgba(22,19,16,.075);

  --ink:#141312;
  --ink-soft:rgba(20,19,18,.62);
  --sub:rgba(20,19,18,.60);
  --subtle:rgba(20,19,18,.48);

  --accent:#825e31;
  --accent-bg:rgba(154,116,66,.10);
  --accent-border:rgba(154,116,66,.22);

  --sage:#215d3b;
  --sage-bg:rgba(38,126,77,.095);
  --sage-border:rgba(38,126,77,.20);

  --scrim-bottom:linear-gradient(to bottom,rgba(244,241,235,0) 0%,rgba(244,241,235,.44) 20%,rgba(244,241,235,.90) 40%,rgba(244,241,235,.97) 60%,#f4f1eb 100%);
  --capsule-bg:linear-gradient(180deg,rgba(255,255,255,.86) 0%,rgba(252,250,246,.78) 100%);
  --capsule-border:rgba(22,19,16,.08);
  --capsule-inset:inset 0 1px 0 #ffffff;
  --icon-well-bg:rgba(138,102,54,.09);
  --icon-well-border:rgba(138,102,54,.14);

  --cta-primary-bg:linear-gradient(180deg,#22201e 0%,#111110 100%);
  --cta-primary-ink:#faf8f4;
  --cta-primary-shadow:0 10px 24px -4px rgba(18,17,16,.24),inset 0 1px 0 rgba(255,255,255,.16);

  --cta-secondary-bg:rgba(20,19,18,.065);
  --cta-secondary-border:rgba(20,19,18,.10);
  --cta-secondary-ink:#141312;

  --nav-bg:rgba(255,255,255,.80);
  --nav-active-bg:linear-gradient(180deg,#22201e 0%,#111110 100%);
  --nav-active-ink:#faf8f4;
  --nav-active-shadow:0 4px 12px rgba(18,17,16,.18),inset 0 1px 0 rgba(255,255,255,.14);

  --chip-bg:rgba(20,19,18,.04);
  --chip-border:rgba(20,19,18,.09);
  --chip-active-bg:linear-gradient(180deg,#22201e 0%,#111110 100%);
  --chip-active-ink:#faf8f4;

  --avatar-ring-bg:#faf8f4;
  --avatar-ring-shadow:0 8px 20px rgba(24,20,16,.11),0 0 0 .75px rgba(22,19,16,.08);
  --sheet-bg:rgba(252,250,246,.95);
  --scrim-modal:rgba(20,18,16,.32);
  --check-bg:#ffffff;
  --check-border:rgba(22,19,16,.26);
  --ring:rgba(130,94,49,.55);
  color-scheme:light;
}
html{
  min-height:100%;
  overscroll-behavior:none;
  background:var(--canvas);
  color:var(--ink);
  font:15px/1.44 -apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
body{
  position:relative;
  max-width:430px;
  min-height:100svh;
  margin:0 auto;
  padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(26px + env(safe-area-inset-bottom,0px));
  overflow-x:hidden;
  overscroll-behavior:none;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-2;
  pointer-events:none;
  background:var(--bg-grad);
}
body::after{
  content:"";
  position:fixed;
  top:-16px;left:-12%;right:-12%;
  height:300px;
  z-index:-1;
  pointer-events:none;
  background:var(--ambient);
}
header,nav,.pair,.actions,.info{display:flex;align-items:center;gap:8px}
header{justify-content:space-between;margin-bottom:12px;padding:0 2px}
strong.brand{
  font-size:28px;
  font-weight:720;
  letter-spacing:-.05em;
  line-height:1;
  cursor:pointer;
  user-select:none;
}
.head-right{display:flex;align-items:center;gap:8px}
button{
  font:inherit;
  color:inherit;
  cursor:pointer;
  border:0;
  background:transparent;
  transition:transform .16s cubic-bezier(.22,1,.36,1),opacity .16s ease,background .2s ease,box-shadow .2s ease,border-color .2s ease;
}
button:active:not(:disabled){transform:scale(.975)}
button:disabled{opacity:.54;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.city-pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:7px 12px 7px 14px;
  border-radius:999px;
  font-size:13px;
  font-weight:580;
  letter-spacing:-.01em;
  background:var(--card);
  border:.75px solid var(--card-border);
  backdrop-filter:blur(24px) saturate(145%);
  -webkit-backdrop-filter:blur(24px) saturate(145%);
  box-shadow:var(--card-shadow),var(--card-inset);
}
.city-pill svg,.picker-trigger svg{width:13px;height:13px;opacity:.62;flex:0 0 auto}
nav{
  background:var(--nav-bg);
  border:.75px solid var(--card-border);
  border-radius:999px;
  padding:3.5px;
  gap:3px;
  margin-bottom:14px;
  backdrop-filter:blur(24px) saturate(145%);
  -webkit-backdrop-filter:blur(24px) saturate(145%);
  box-shadow:var(--card-shadow),var(--card-inset);
}
nav button{
  flex:1 1 0;
  min-width:0;
  padding:8px 10px;
  border-radius:999px;
  font-size:12.5px;
  font-weight:560;
  letter-spacing:-.01em;
  color:var(--sub);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-variant-numeric:tabular-nums;
}
nav button[aria-pressed="true"]{
  background:var(--nav-active-bg);
  color:var(--nav-active-ink);
  font-weight:620;
  box-shadow:var(--nav-active-shadow);
}
.stack{display:flex;flex-direction:column;gap:12px}
.intro{padding:0 2px 2px}
.intro-eyebrow{
  display:block;
  font-size:10px;
  font-weight:620;
  letter-spacing:.13em;
  text-transform:uppercase;
  color:var(--accent);
  margin-bottom:6px;
}
h1{
  font-size:clamp(28px,7.6vw,34px);
  font-weight:650;
  line-height:1.06;
  letter-spacing:-.038em;
  margin:0 0 6px;
}
p{margin:0}
.muted{color:var(--sub)}
.intro p{font-size:14px;line-height:1.44;max-width:34ch}
/* Architectural Glass Cards */
.ticket{
  position:relative;
  background:var(--card);
  border:.75px solid var(--card-border);
  border-radius:22px;
  padding:15px 16px;
  color:var(--ink);
  backdrop-filter:blur(24px) saturate(145%);
  -webkit-backdrop-filter:blur(24px) saturate(145%);
  box-shadow:var(--card-shadow),var(--card-inset);
}
.ticket small{display:block;font-size:12px;font-weight:540;color:var(--sub)}
.ticket p{margin:4px 0 0}
.ticket h2{margin:4px 0 0;font-size:24px;font-weight:640;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
/* Grouped City Card on Startscreen */
.city-group{padding:0;overflow:hidden}
.city-btn{
  width:100%;
  text-align:left;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:12.5px 16px;
  font-size:15px;
  font-weight:560;
  letter-spacing:-.014em;
  color:var(--ink);
  border-radius:0;
}
.city-btn+.city-btn{border-top:1px solid var(--divider)}
.city-btn:disabled{opacity:.64}
.city-btn:hover:not(:disabled){background:rgba(160,148,132,.07)}
.status-pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3.5px 9.5px;
  border-radius:999px;
  font-size:11px;
  font-weight:600;
  letter-spacing:.005em;
  background:var(--sage-bg);
  border:.75px solid var(--sage-border);
  color:var(--sage);
}
.open-tag{font-size:11.5px;font-weight:500;color:var(--subtle)}
.status{color:var(--sage);font-weight:600;font-variant-numeric:tabular-nums}
.check{
  display:flex;
  align-items:flex-start;
  gap:10px;
  font-size:12.5px;
  line-height:1.42;
  color:var(--sub);
  margin-top:8px;
  cursor:pointer;
}
.check input{
  appearance:none;
  -webkit-appearance:none;
  width:19px;
  height:19px;
  margin:1px 0 0;
  flex:0 0 auto;
  border-radius:6px;
  background:var(--check-bg);
  border:1.25px solid var(--check-border);
  position:relative;
  cursor:pointer;
}
.check input:checked{
  background:var(--cta-primary-bg);
  border-color:transparent;
}
.check input:checked::after{
  content:"";
  position:absolute;
  left:5.5px;
  top:2px;
  width:5px;
  height:9.5px;
  border:solid var(--cta-primary-ink);
  border-width:0 2px 2px 0;
  transform:rotate(42deg);
}
.text-btn{
  background:none;
  padding:6px 14px;
  color:var(--sub);
  font-size:12.5px;
  font-weight:520;
  border-radius:999px;
}
.theme-btn{align-self:center}
/* =========================================================
   PORTRAIT CARD — Apple Invites Luxury Aesthetic
   ========================================================= */
.hero{
  position:relative;
  isolation:isolate;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  min-height:clamp(540px,74svh,610px);
  border-radius:28px;
  overflow:hidden;
  background:var(--canvas);
  border:.75px solid var(--card-border);
  box-shadow:var(--card-shadow);
}
.hero>img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center 18%;
  filter:brightness(1.03) contrast(1.01) saturate(1.02);
  z-index:1;
}
.hero-top-scrim{
  position:absolute;
  top:0;left:0;right:0;
  height:96px;
  background:linear-gradient(to bottom,rgba(14,13,12,.44) 0%,rgba(14,13,12,.10) 58%,transparent 100%);
  z-index:2;
  pointer-events:none;
}
.hero-blur{
  position:absolute;
  left:0;right:0;bottom:0;
  height:48%;
  backdrop-filter:blur(24px) saturate(135%);
  -webkit-backdrop-filter:blur(24px) saturate(135%);
  mask-image:linear-gradient(to bottom,transparent 0%,rgba(0,0,0,.44) 28%,rgba(0,0,0,1) 58%);
  -webkit-mask-image:linear-gradient(to bottom,transparent 0%,rgba(0,0,0,.44) 28%,rgba(0,0,0,1) 58%);
  z-index:3;
  pointer-events:none;
}
.hero-scrim{
  position:absolute;
  left:0;right:0;bottom:0;
  height:58%;
  background:var(--scrim-bottom);
  z-index:4;
  pointer-events:none;
}
html.light .hero-scrim{height:63%}
.eyebrow{
  position:relative;
  z-index:10;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  padding:14px 14px 0;
}
.eyebrow-pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:5.5px 11px;
  border-radius:999px;
  background:rgba(18,17,15,.54);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border:.75px solid rgba(255,248,236,.18);
  font-size:11.5px;
  font-weight:520;
  color:rgba(250,247,242,.95);
  font-variant-numeric:tabular-nums;
}
.eyebrow-dot{
  width:6px;height:6px;border-radius:50%;
  background:#dfc69f;
  box-shadow:0 0 6px rgba(223,198,159,.6);
  flex:0 0 auto;
}
.hero-content{
  position:relative;
  z-index:10;
  margin-top:auto;
  padding:0 15px 16px;
  display:flex;
  flex-direction:column;
  gap:11px;
}
.hero-head{
  padding:0 2px;
  display:flex;
  flex-direction:column;
  gap:3px;
}
.hero-name{
  font-size:29px;
  font-weight:620;
  letter-spacing:-.034em;
  line-height:1.06;
  color:var(--ink);
  margin:0;
}
.hero-age{font-weight:400;color:var(--ink-soft)}
.hero-note{
  font-size:13px;
  line-height:1.38;
  color:var(--sub);
  margin:2px 0 0;
}
.details-capsule{
  background:var(--capsule-bg);
  backdrop-filter:blur(26px) saturate(145%);
  -webkit-backdrop-filter:blur(26px) saturate(145%);
  border:.75px solid var(--capsule-border);
  border-radius:20px;
  padding:11px 13px;
  box-shadow:0 12px 28px rgba(0,0,0,.14),var(--capsule-inset);
}
.detail-row{display:flex;align-items:center;gap:11px}
.detail-icon-well{
  width:30px;height:30px;
  border-radius:9px;
  background:var(--icon-well-bg);
  border:.5px solid var(--icon-well-border);
  display:flex;align-items:center;justify-content:center;
  flex:0 0 auto;
  color:var(--accent);
}
.detail-text{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.detail-primary{
  font-size:13.5px;
  font-weight:580;
  letter-spacing:-.014em;
  color:var(--ink);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-variant-numeric:tabular-nums;
}
.capsule-divider{height:1px;background:var(--divider);margin:9px 0 9px 41px}
/* Sculpted Primary & Clear Secondary Pills */
.actions{margin-top:2px;flex-wrap:wrap;gap:9px}
.actions button{
  flex:1 1 auto;
  white-space:nowrap;
  height:46px;
  border-radius:999px;
  padding:0 18px;
  font-size:14px;
  letter-spacing:-.014em;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
.primary{
  background:var(--cta-primary-bg);
  color:var(--cta-primary-ink);
  font-weight:620;
  box-shadow:var(--cta-primary-shadow);
}
.secondary{
  background:var(--cta-secondary-bg);
  border:.75px solid var(--cta-secondary-border);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  color:var(--cta-secondary-ink);
  font-weight:540;
}
/* Form (Heute Bock) — Zero native <select> */
.form-card{display:flex;flex-direction:column;gap:16px;padding:18px 16px}
.field{display:flex;flex-direction:column;gap:8px}
.field-label{
  display:block;
  font-size:10.5px;
  font-weight:620;
  letter-spacing:.10em;
  text-transform:uppercase;
  color:var(--subtle);
}
.chip-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chip-grid.two-col{grid-template-columns:repeat(2,minmax(0,1fr))}
.glass-chip{
  padding:10.5px 8px;
  border-radius:14px;
  font-size:13px;
  font-weight:560;
  letter-spacing:-.01em;
  font-variant-numeric:tabular-nums;
  text-align:center;
  color:var(--ink);
  background:var(--chip-bg);
  border:.75px solid var(--chip-border);
}
.glass-chip[aria-pressed="true"]{
  background:var(--chip-active-bg);
  color:var(--chip-active-ink);
  border-color:transparent;
  font-weight:620;
  box-shadow:var(--cta-primary-shadow);
}
.picker-trigger{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:10px 13px 10px 10px;
  border-radius:16px;
  text-align:left;
  font-size:14px;
  font-weight:560;
  letter-spacing:-.012em;
  color:var(--ink);
  background:var(--chip-bg);
  border:.75px solid var(--chip-border);
}
.picker-left{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.picker-left span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.form-foot{
  display:flex;
  flex-direction:column;
  gap:12px;
  padding-top:4px;
  border-top:1px solid var(--divider);
}
.end-hint{
  display:block;
  font-size:12px;
  color:var(--sub);
  font-variant-numeric:tabular-nums;
  padding-top:8px;
}
/* Active Entry / Applicants / Date / Pass */
.info{justify-content:space-between;align-items:flex-start}
.applicant{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--divider)}
.info+.applicant{border-top:0;padding-top:6px}
.applicant img{width:50px;height:50px;border-radius:50%;object-fit:cover;object-position:center 20%;flex:0 0 auto;border:1.5px solid var(--card-border)}
.applicant-main{flex:1;min-width:0}
.applicant-main p{margin:2px 0 0;font-size:13.5px}
.mini-actions{display:flex;gap:8px;margin-top:8px}
.mini-actions button{height:36px;padding:0 14px;font-size:13px;border-radius:999px;flex:1}
.pass{text-align:center;padding-top:16px}
.pass>p{margin:6px auto 14px;max-width:30ch}
.pair{justify-content:center;margin-bottom:14px}
.pair img{
  width:62px;height:62px;border-radius:50%;object-fit:cover;object-position:center 20%;
  border:2.5px solid var(--avatar-ring-bg);
  box-shadow:var(--avatar-ring-shadow);
}
.pair img+img{margin-left:-16px}
.pass .ticket{text-align:left;margin-top:18px}
.location{margin-top:14px;padding-top:14px;border-top:1px solid var(--divider)}
.location a{display:inline-block;margin-top:10px;color:var(--accent);font-weight:600;font-size:13.5px;text-decoration:none}
.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.status-grid button{
  padding:10px 12px;font-size:13px;font-weight:560;border-radius:14px;
  background:var(--chip-bg);border:.75px solid var(--chip-border);
}
.status-grid button[aria-pressed="true"]{
  background:var(--chip-active-bg);color:var(--chip-active-ink);border-color:transparent;
}
.note{font-size:12.5px;color:var(--sub);margin:10px 0 0}
/* Glass Bottom Sheet */
.sheet-backdrop{
  position:fixed;inset:0;z-index:50;
  display:flex;align-items:flex-end;justify-content:center;
  padding:12px 10px calc(12px + env(safe-area-inset-bottom,0px));
  background:var(--scrim-modal);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}
.sheet{
  width:100%;max-width:410px;max-height:80svh;overflow-y:auto;
  padding:10px 16px 16px;border-radius:26px;color:var(--ink);
  background:var(--sheet-bg);border:.75px solid var(--card-border);
  backdrop-filter:blur(28px) saturate(160%);
  -webkit-backdrop-filter:blur(28px) saturate(160%);
  box-shadow:0 24px 60px -12px rgba(0,0,0,.50),var(--card-inset);
}
.sheet-handle{width:36px;height:4px;border-radius:999px;margin:0 auto 12px;background:var(--divider)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;padding:0 2px}
.sheet-head strong{font-size:15.5px;font-weight:640;letter-spacing:-.02em}
.sheet-close{
  padding:5.5px 12px;border-radius:999px;font-size:12.5px;font-weight:600;
  color:var(--sub);background:var(--chip-bg);border:.75px solid var(--chip-border);
}
.sheet-list{display:flex;flex-direction:column;gap:7px}
.sheet-opt{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12.5px 14px;border-radius:15px;text-align:left;font-size:14.5px;font-weight:560;
  background:var(--chip-bg);border:.75px solid var(--chip-border);
}
.sheet-opt[aria-selected="true"]{
  background:var(--chip-active-bg);color:var(--chip-active-ink);border-color:transparent;
}
.sheet-opt small{font-size:12px;font-weight:580;color:var(--sub)}
.sheet-opt[aria-selected="true"] small{color:inherit;opacity:.85}
/* Responsive iPhone Frame (Desktop >=500px only; Mobile <500px renders direct full-screen without iframe) */
.bar,.home,.phone-bg,.phone-ambient{display:none}
.phone,.glass,.app-stage,.app-scroll,.app-shell{display:block;position:static;width:auto;height:auto;margin:0;padding:0;border:0;border-radius:0;background:none;box-shadow:none;overflow:visible;transform:none}
@media(min-width:500px){
  html,body{height:100%;max-width:none;margin:0;padding:0;overflow:hidden;overscroll-behavior:none}
  body{background:radial-gradient(ellipse at 50% 35%,#504c49,#242326 72%);display:grid;place-items:center}
  body::before,body::after{display:none}
  .phone{
    width:405px;height:850px;padding:8px;
    border:2px solid #aba9a4;border-radius:60px;background:#111110;
    box-shadow:inset 0 0 0 2px #4e5052,0 18px 55px #0007;
    position:relative;transform:scale(var(--scale,1));
  }
  .glass{
    position:relative;isolation:isolate;
    height:100%;border-radius:49px;overflow:hidden;
    background:var(--canvas);color:var(--ink);
    display:grid;grid-template-rows:43px 1fr 18px;
  }
  .phone-bg{
    display:block;position:absolute;inset:0;z-index:-2;pointer-events:none;
    background:var(--bg-grad);
  }
  .phone-ambient{
    display:block;position:absolute;top:-16px;left:-12%;right:-12%;height:300px;z-index:-1;pointer-events:none;
    background:var(--ambient);
  }
  .bar{
    position:relative;z-index:5;
    display:flex;align-items:center;justify-content:space-between;
    padding:4px 28px 0;
    font:600 13px -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    color:var(--ink);
  }
  .island{
    position:absolute;left:50%;top:9px;transform:translateX(-50%);
    width:102px;height:26px;background:#09090a;border-radius:20px;
  }
  .battery{
    width:22px;height:11px;border:1px solid currentColor;border-radius:3px;padding:1px;position:relative;
  }
  .battery:before{content:"";display:block;height:100%;width:85%;background:currentColor;border-radius:1px}
  .battery:after{content:"";position:absolute;width:2px;height:5px;background:currentColor;right:-4px;top:2px}
  .app-stage{position:relative;min-height:0;height:100%;overflow:hidden}
  .app-scroll{
    height:100%;overflow-y:auto;overflow-x:hidden;
    overscroll-behavior:none;-webkit-overflow-scrolling:touch;
  }
  .app-shell{position:relative;min-height:100%;padding:12px 16px 26px}
  .home{
    display:block;position:relative;z-index:5;
    align-self:center;justify-self:center;
    width:110px;height:4px;background:var(--ink);opacity:.82;border-radius:6px;
  }
  #sheetHost{position:absolute;inset:0;z-index:50;pointer-events:none}
  #sheetHost .sheet-backdrop{position:absolute;inset:0;pointer-events:auto}
}

function buildTodayTimes() {
  const now = new Date();
  const curMin = now.getHours() * 60 + now.getMinutes();
  let m = Math.ceil(Math.max(curMin + 75, 17 * 60 + 30) / 30) * 30;
  const out = [];
  for (let i = 0; i < 6 && m <= 23 * 60; i++, m += 30) {
    out.push({ label: `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`, minutesOfDay: m });
  }
  if (out.length < 3) {
    return [
      { label:'19:00', demoMin:90 },
      { label:'19:30', demoMin:120 },
      { label:'20:00', demoMin:150 },
      { label:'20:30', demoMin:180 },
      { label:'21:00', demoMin:210 }
    ];
  }
  return out;
}

function calcEnd(slot, hours) {
  const now = new Date();
  const nowMs = now.getTime();
  let meetMs;
  if (slot.demoMin) {
    meetMs = nowMs + slot.demoMin * 60000;
  } else {
    const d = new Date(now);
    d.setHours(Math.floor(slot.minutesOfDay / 60), slot.minutesOfDay % 60, 0, 0);
    meetMs = d.getTime();
  }
  const latestMs = meetMs - 30 * 60000;
  const desiredMs = nowMs + hours * 3600000;
  const endMs = Math.max(nowMs + 5 * 60000, Math.min(desiredMs, latestMs));
  const capped = latestMs <= desiredMs;
  const ed = new Date(endMs);
  return {
    endMs,
    capped,
    endLabel: `${String(ed.getHours()).padStart(2, '0')}:${String(ed.getMinutes()).padStart(2, '0')}`
  };
}

function fmtLeft(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const r = s % 60;
  return h > 0
    ? `${h}:${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`
    : `${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
}

function seedCity(cityName) {
  const spots = cities[cityName];
  const slots = buildTodayTimes();
  const now = Date.now();
  const cast = [people.Lena, people.Jonas, people.Nora, people.David, people.Maya];
  const off = Object.keys(cities).indexOf(cityName);
  const pick = i => cast[(off + i) % cast.length];
  return [
    { id:`${cityName}-0`, person:pick(0), time:slots[0].label, spot:spots[0], count:4, endsAt:now + 54*60000, joined:false },
    { id:`${cityName}-1`, person:pick(1), time:(slots[1]||slots[0]).label, spot:spots[1]||spots[0], count:9, endsAt:now + 82*60000, joined:false },
    { id:`${cityName}-2`, person:pick(2), time:(slots[2]||slots[0]).label, spot:spots[2]||spots[0], count:10, endsAt:now + 38*60000, joined:false }
  ];
}

let consent = false;

const systemTheme = matchMedia('(prefers-color-scheme: light)');
function theme() {
  const isLight = themeMode === 'light' || (themeMode === 'auto' && systemTheme.matches);
  document.documentElement.classList.toggle('light', isLight);
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.setAttribute('content', isLight ? '#f4f1eb' : '#111110'));
}
try { themeMode = localStorage.skipTheme || 'auto'; } catch {}
theme();
systemTheme.onchange = () => { theme(); if (!city) render(); };

function renderDate() {
  if (revisit) {
    const p = revisit.person;
    if (revisit.stage === 'ask') {
      return `<article class="pass">
        <div class="pair"><img src="${people.Lukas.img}" alt="Lukas"><img src="${p.img}" alt="${p.name}"></div>
        <h1>Wiedersehen?</h1>
        <p class="muted">Kontakt wird nur freigegeben, wenn ihr beide mit Ja antwortet.</p>
        <div class="actions">${btn('rev-no', 'Nein', 'secondary')}${btn('rev-yes', 'Ja', 'primary')}</div>
      </article>`;
    }
    if (revisit.stage === 'wait') {
      return `<article class="pass">
        <div class="pair"><img src="${people.Lukas.img}" alt="Lukas"><img src="${p.img}" alt="${p.name}"></div>
        <h1>Antwort gespeichert.</h1>
        <p class="muted">Warte auf ${p.name}.</p>
        <div class="actions">${btn('rev-sim-yes', `Test: ${p.name} sagt Ja`)}${btn('rev-sim-no', `Test: ${p.name} sagt Nein`, 'secondary')}</div>
      </article>`;
    }
    if (revisit.stage === 'yes') {
      return `<article class="pass">
        <div class="pair"><img src="${people.Lukas.img}" alt="Lukas"><img src="${p.img}" alt="${p.name}"></div>
        <span class="status-pill" style="margin-bottom:10px">✓ Beidseitiges Ja</span>
        <h1>Kontakt freigegeben.</h1>
        <div class="ticket">
          <small>${p.name}, ${p.age} ✓</small>
          <p><strong>${p.contact}</strong></p>
        </div>
        <div class="actions" style="margin-top:14px">${btn('finish', 'Zurück zur Stadt', 'secondary')}</div>
      </article>`;
    }
    return `<article class="pass">
      <h1>Alles klar.</h1>
      <p class="muted">Dein Kontakt bleibt privat. Der Eintrag wird heute Nacht gelöscht.</p>
      <div class="actions">${btn('finish', 'Zurück zur Stadt', 'secondary')}</div>
    </article>`;
  }

  const d = activeDate;
  if (!d) return '';
  if (d.cancelled) {
    return `<article class="pass">
      <h1>Treffen abgesagt.</h1>
      <p class="muted">${d.person.name} wurde informiert. Kein Chat.</p>
      <div class="actions">${btn('finish', 'Zurück zur Stadt', 'secondary')}</div>
    </article>`;
  }
  if (d.reported) {
    return `<article class="pass">
      <h1>Gemeldet &amp; blockiert.</h1>
      <p class="muted">${d.person.name} kann dich nicht mehr sehen.</p>
      <div class="actions">${btn('finish', 'Zurück zur Stadt', 'secondary')}</div>
    </article>`;
  }

  const mapQuery = encodeURIComponent(`${d.spot} ${d.city}`);
  const statuses = ['Unterwegs', '+10 Min.', 'Bin da', 'Absagen'];

  return `<article class="pass">
    <div class="pair"><img src="${people.Lukas.img}" alt="Lukas"><img src="${d.person.img}" alt="${d.person.name}"></div>
    <span class="status-pill" style="margin-bottom:10px">✓ Beide dabei</span>
    <h1>Das Treffen steht.</h1>
    <p class="muted">Du und ${d.person.name} in ${d.city} · Kein Chat</p>
    ${d.others > 0 ? `<p class="note">${d.others} weitere Zusagen erhielten sofort „Diesmal vergeben“.</p>` : ''}
    <div class="ticket">
      <small>Verabredung</small>
      <h2>Heute, ${d.time} Uhr</h2>
      <div class="location">
        <small>Öffentlicher Treffpunkt</small>
        <p>${d.spot}</p>
        <a href="https://maps.apple.com/?q=${mapQuery}" target="_blank" rel="noopener">In Karten öffnen ↗</a>
      </div>
      <div class="location">
        <small>Status (ohne Chat)</small>
        <div class="status-grid">
          ${statuses.map(st => `<button type="button" data-action="status" data-st="${st}" aria-pressed="${d.status === st}">${st}</button>`).join('')}
        </div>
        ${d.status ? `<p class="note">Status gesendet: ${d.status}</p>` : ''}
      </div>
      <div class="location">
        <div class="actions" style="margin-top:0">
          ${btn('share', 'Mit Freunden teilen', 'secondary')}
          ${btn('report', 'Melden / Blockieren', 'secondary')}
        </div>
        ${infoMsg ? `<p class="note">${infoMsg}</p>` : ''}
      </div>
    </div>
    <div class="actions" style="margin-top:14px">${btn('revisit', 'Nach dem Treffen: Wiedersehen?')}</div>
  </article>`;
}

function renderSheet() {
  if (!sheet) return '';
  if (sheet === 'city') {
    const all = [...launchCities, ...moreCities];
    return `<div class="sheet-backdrop" data-action="backdrop" role="dialog" aria-modal="true" aria-label="Stadt wählen">
      <div class="sheet">
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="sheet-head">
          <strong>Stadt</strong>
          <button type="button" class="sheet-close" data-action="close-sheet">Fertig</button>
        </div>
        <div class="sheet-list" role="listbox" aria-label="Stadt">
          ${all.map(c => `<button type="button" class="sheet-opt" role="option" aria-selected="${c === city}" data-action="pick-city" data-city="${c}">
            <span>${c}</span>
            <small>${c === city ? '✓' : (launchCities.includes(c) ? 'Heute aktiv' : 'Offen')}</small>

      </div>

  }
  if (sheet === 'spot' && city) {
    return `<div class="sheet-backdrop" data-action="backdrop" role="dialog" aria-modal="true" aria-label="Öffentlicher Ort">
      <div class="sheet">
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="sheet-head">
          <strong>Öffentlicher Ort (${city})</strong>
          <button type="button" class="sheet-close" data-action="close-sheet">Fertig</button>
        </div>
        <div class="sheet-list" role="listbox" aria-label="Öffentlicher Ort">
          ${cities[city].map((sp, i) => `<button type="button" class="sheet-opt" role="option" aria-selected="${i === draft.spotIdx}" data-action="pick-spot" data-idx="${i}">
            <span>${sp}</span>
            <small>${i === draft.spotIdx ? '✓' : ''}</small>
          </button>`).join('')}
        </div>
      </div>
    </div>`;
  }
  return '';
}

function render() {
  if (city) {
    cityTrigger.style.display = '';
    cityTrigger.innerHTML = `<span>${city}</span>${chevronSvg}`;
  } else {
    cityTrigger.style.display = 'none';
  }
  if (!city) {
    screen.innerHTML = renderStart();
    sheetHost.innerHTML = '';
    return;
  }
  let body = '';
  if (tab === 'list') body = renderList();
  else if (tab === 'mine') body = renderMine();
  else body = renderDate();
  screen.innerHTML = renderNav() + body;
  sheetHost.innerHTML = renderSheet();
}

setInterval(() => {
  const now = Date.now();
  document.querySelectorAll('[data-cd]').forEach(el => {
    el.textContent = fmtLeft(Number(el.dataset.cd) - now);
  });
  if (myEntry && !myEntry.expired && now >= myEntry.endsAt) {
    myEntry.expired = true;
    render();
  }
}, 1000);

document.getElementById('brandBtn').onclick = () => { city = null; takenBy = null; infoMsg = ''; sheet = null; render(); };
cityTrigger.onclick = () => { if (!city) return; sheet = 'city'; render(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheet) { sheet = null; render(); } });

screen.onchange = e => {
  if (e.target.id === 'consent') { consent = e.target.checked; render(); }
};

function handleAction(e) {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const act = el.dataset.action;

  if (act === 'city') {
    if (!consent) return;
    city = el.dataset.city;
    draft.spotIdx = 0;
    tab = 'list';
    takenBy = null;
    infoMsg = '';
    sheet = null;
    render();
    scrollAppTop();
  } else if (act === 'open-sheet') {
    sheet = el.dataset.sheet;
    render();
  } else if (act === 'backdrop') {
    if (e.target !== el) return;
    sheet = null;
    render();
  } else if (act === 'close-sheet') {
    sheet = null;
    render();
  } else if (act === 'pick-city') {
    city = el.dataset.city;
    draft.spotIdx = 0;
    tab = 'list';
    takenBy = null;
    infoMsg = '';
    sheet = null;
    render();
    scrollAppTop();
  } else if (act === 'pick-time') {
    draft.timeIdx = Number(el.dataset.idx);
    render();
  } else if (act === 'pick-spot') {
    draft.spotIdx = Number(el.dataset.idx);
    sheet = null;
    render();
  } else if (act === 'pick-dur') {
    draft.hours = Number(el.dataset.hours);
    render();
  } else if (act === 'theme') {
    themeMode = document.documentElement.classList.contains('light') ? 'dark' : 'light';
    theme();
    try { localStorage.skipTheme = themeMode; } catch {}
    render();
  } else if (act === 'tab') {
    tab = el.dataset.tab;
    takenBy = null;
    sheet = null;
    render();
    scrollAppTop();
  } else if (act === 'join') {
    const it = getList().find(x => x.id === el.dataset.id);
    if (!it || it.count >= 10) return;
    it.count += 1;
    it.joined = true;
    render();
  } else if (act === 'sim-yes') {
    const it = getList().find(x => x.id === el.dataset.id);
    if (!it) return;
    revisit = null;
    infoMsg = '';
    activeDate = { person:it.person, city, time:it.time, spot:it.spot, status:'', others:Math.max(0, it.count - 1), cancelled:false, reported:false };
    tab = 'date';
    render();
    scrollAppTop();
  } else if (act === 'sim-taken') {
    const it = getList().find(x => x.id === el.dataset.id);
    if (!it) return;
    it.joined = false;
    takenBy = it.person.name;
    render();
    scrollAppTop();
  } else if (act === 'clear-taken') {
    takenBy = null;
    render();
  } else if (act === 'publish') {
    const slots = buildTodayTimes();
    const slot = slots[draft.timeIdx] || slots[0];
    const calc = calcEnd(slot, draft.hours);
    myEntry = {
      time:slot.label,
      spot:cities[city][draft.spotIdx] || cities[city][0],
      endsAt:calc.endMs,
      endLabel:calc.endLabel,
      capped:calc.capped,
      expired:false,
      applicants:[people.Lena, people.Nora, people.Maya],
      usedNames:new Set(['Lena', 'Nora', 'Maya'])
    };
    render();
    scrollAppTop();
  } else if (act === 'sim-add') {
    if (!myEntry || myEntry.applicants.length >= 10) return;
    if (!myEntry.usedNames) myEntry.usedNames = new Set(myEntry.applicants.map(p => p.name));
    const next = extraApplicants.find(([name]) => !myEntry.usedNames.has(name));
    if (!next) return;
    const [name, age, note] = next;
    myEntry.usedNames.add(name);
    myEntry.applicants.push({ name, age, note, img: avatar(name), contact: '+49 1·· ···· ····' });
    render();
  } else if (act === 'choose-no') {
    if (!myEntry) return;
    myEntry.applicants.splice(Number(el.dataset.idx), 1);
    render();
  } else if (act === 'choose-yes') {
    if (!myEntry) return;
    const chosen = myEntry.applicants[Number(el.dataset.idx)];
    if (!chosen) return;
    const others = Math.max(0, myEntry.applicants.length - 1);
    revisit = null;
    infoMsg = '';
    activeDate = { person:chosen, city, time:myEntry.time, spot:myEntry.spot, status:'', others, cancelled:false, reported:false };
    myEntry = null;
    tab = 'date';
    render();
    scrollAppTop();
  } else if (act === 'sim-expire') {
    if (myEntry) { myEntry.expired = true; render(); scrollAppTop(); }
  } else if (act === 'reset-mine') {
    myEntry = null;
    render();
  } else if (act === 'status') {
    if (!activeDate) return;
    const st = el.dataset.st;
    if (st === 'Absagen') { if (!confirm('Treffen wirklich absagen?')) return; activeDate.cancelled = true; }
    else { activeDate.status = st; }
    render();
  } else if (act === 'share') {
    if (!activeDate) return;
    const msg = `Skip-Treffen heute um ${activeDate.time} Uhr mit ${activeDate.person.name} (${activeDate.spot}, ${activeDate.city}).`;
    if (navigator.clipboard) navigator.clipboard.writeText(msg).catch(() => {});
    infoMsg = `Kopiert: „${msg}“`;
    render();
  } else if (act === 'report') {
    if (activeDate && confirm(`${activeDate.person.name} melden und blockieren?`)) { activeDate.reported = true; render(); }
  } else if (act === 'revisit') {
    if (!activeDate) return;
    revisit = { stage:'ask', person:activeDate.person };
    render();
    scrollAppTop();
  } else if (act === 'rev-yes') {
    if (revisit) { revisit.stage = 'wait'; render(); }
  } else if (act === 'rev-no' || act === 'rev-sim-no') {
    if (revisit) { revisit.stage = 'no'; render(); }
  } else if (act === 'rev-sim-yes') {
    if (revisit) { revisit.stage = 'yes'; render(); }
  } else if (act === 'finish') {
    activeDate = null;
    revisit = null;
    infoMsg = '';
    Object.values(entriesByCity).forEach(list => list.forEach(it => { it.joined = false; }));
    tab = 'list';
    render();
    scrollAppTop();
  }
}

screen.onclick = handleAction;
sheetHost.onclick = handleAction;

render();
const appScroll = document.getElementById('appScroll');
function scrollAppTop() {
  if (appScroll && innerWidth >= 500) appScroll.scrollTop = 0;
  else window.scrollTo(0, 0);
}
function fitPhone() {
  document.documentElement.style.setProperty('--scale', Math.min(1, (innerHeight - 24) / 850, (innerWidth - 24) / 405));
}
fitPhone();
addEventListener('resize', fitPhone);

</script></body></html>
